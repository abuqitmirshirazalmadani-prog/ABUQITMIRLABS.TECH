    <!-- Universal Head Metadata & Canonical Deduplicator (Strict Single-Tag Enforcement) -->
    <script>
      (function() {
        function dedupeHead() {
          try {
            // 1. Strict Canonical Deduplication: keep only the latest route-specific canonical
            var canons = document.querySelectorAll('link[rel="canonical"]');
            if (canons.length > 1) {
              var isSubpage = window.location.pathname !== '/' && window.location.pathname !== '';
              var primaryCanon = canons[canons.length - 1];
              for (var c = 0; c < canons.length; c++) {
                var href = canons[c].getAttribute('href') || '';
                if (isSubpage && (href === 'https://www.abuqitmirlabs.tech/' || href === 'https://www.abuqitmirlabs.tech')) {
                  if (canons[c].parentNode) canons[c].parentNode.removeChild(canons[c]);
                } else if (canons[c] !== primaryCanon && canons[c].parentNode) {
                  canons[c].parentNode.removeChild(canons[c]);
                }
              }
            }

            // 2. Strict Title Deduplication: preserve active title
            var titles = document.querySelectorAll('title');
            if (titles.length > 1) {
              var activeTitle = document.querySelector('title[data-rh="true"]') || titles[titles.length - 1];
              for (var t = 0; t < titles.length; t++) {
                if (titles[t] !== activeTitle && titles[t].parentNode) {
                  titles[t].parentNode.removeChild(titles[t]);
                }
              }
            }

            // 3. Strict Meta Description Deduplication: keep exactly 1
            var descs = document.querySelectorAll('meta[name="description"]');
            if (descs.length > 1) {
              for (var d = 0; d < descs.length - 1; d++) {
                if (descs[d].parentNode) descs[d].parentNode.removeChild(descs[d]);
              }
            }

            // 4. Strict OG & Twitter Deduplication
            var ogTitles = document.querySelectorAll('meta[property="og:title"]');
            if (ogTitles.length > 1) {
              for (var ot = 0; ot < ogTitles.length - 1; ot++) {
                if (ogTitles[ot].parentNode) ogTitles[ot].parentNode.removeChild(ogTitles[ot]);
              }
            }

            var ogUrls = document.querySelectorAll('meta[property="og:url"]');
            if (ogUrls.length > 1) {
              for (var ou = 0; ou < ogUrls.length - 1; ou++) {
                if (ogUrls[ou].parentNode) ogUrls[ou].parentNode.removeChild(ogUrls[ou]);
              }
            }

            // 5. Strict JSON-LD Deduplication: Prevent duplicate @graph scripts
            var ldScripts = document.querySelectorAll('script[type="application/ld+json"]');
            if (ldScripts.length > 1) {
              var seenIds = {};
              for (var s = 0; s < ldScripts.length; s++) {
                try {
                  var parsed = JSON.parse(ldScripts[s].textContent || '{}');
                  var keyId = parsed['@id'] || (parsed['@graph'] && parsed['@graph'][0] && parsed['@graph'][0]['@id']) || 'schema-' + s;
                  if (seenIds[keyId]) {
                    if (ldScripts[s].parentNode) ldScripts[s].parentNode.removeChild(ldScripts[s]);
                  } else {
                    seenIds[keyId] = true;
                  }
                } catch(e) {}
              }
            }
          } catch(err) {}
        }

        if (typeof MutationObserver !== 'undefined') {
          try {
            new MutationObserver(dedupeHead).observe(document.head || document.documentElement, {
              childList: true,
              subtree: true
            });
          } catch(e) {}
        }
        window.addEventListener('DOMContentLoaded', dedupeHead);
      })();
    </script>
